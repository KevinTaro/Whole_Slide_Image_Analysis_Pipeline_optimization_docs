<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#ececec"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b5b5b5" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1600" height="560" fill="#fff"/>

  <!-- system layer frame (mine) -->
  <rect x="240" y="40" width="1345" height="262" rx="14" fill="none" stroke="#111" stroke-width="4"/>
  <text x="262" y="76" font-size="21" font-weight="700" fill="#111">系統層（本人負責）：記憶體管理・工作流程・非同步與平行化</text>

  <!-- input (teammate) -->
  <rect x="30" y="110" width="190" height="120" rx="8" fill="url(#hatch)" stroke="#555" stroke-width="2"/>
  <text x="125" y="152" font-size="20" font-weight="700" text-anchor="middle">輸入</text>
  <text x="125" y="180" font-size="17" text-anchor="middle">IHC／DISH 影像對</text>
  <text x="125" y="206" font-size="16" text-anchor="middle" fill="#333">（配準：組員）</text>

  <!-- reader -->
  <rect x="255" y="110" width="190" height="120" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="350" y="160" font-size="20" font-weight="700" text-anchor="middle">分塊讀取</text>
  <text x="350" y="190" font-size="17" text-anchor="middle">tile reader</text>

  <!-- M1 (teammate model) -->
  <rect x="480" y="110" width="190" height="120" rx="8" fill="url(#hatch)" stroke="#555" stroke-width="2"/>
  <text x="575" y="148" font-size="20" font-weight="700" text-anchor="middle">M1 疊合</text>
  <text x="575" y="176" font-size="17" text-anchor="middle">核心區遮罩</text>
  <text x="575" y="204" font-size="16" text-anchor="middle" fill="#333">UNet++（組員）</text>

  <!-- M2 (teammate model) -->
  <rect x="705" y="110" width="190" height="120" rx="8" fill="url(#hatch)" stroke="#555" stroke-width="2"/>
  <text x="800" y="148" font-size="20" font-weight="700" text-anchor="middle">M2 細胞分割</text>
  <text x="800" y="176" font-size="17" text-anchor="middle">IHC＋DISH 細胞</text>
  <text x="800" y="204" font-size="16" text-anchor="middle" fill="#333">Cellpose（組員）</text>

  <!-- M3 -->
  <rect x="930" y="110" width="190" height="120" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1025" y="148" font-size="20" font-weight="700" text-anchor="middle">M3 訊號計數</text>
  <text x="1025" y="176" font-size="16" text-anchor="middle">細胞核 Cellpose（組員）</text>
  <text x="1025" y="204" font-size="16" text-anchor="middle">HER2／CEP17 點位偵測</text>

  <!-- stitch -->
  <rect x="1155" y="110" width="190" height="120" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1250" y="160" font-size="20" font-weight="700" text-anchor="middle">縫合</text>
  <text x="1250" y="190" font-size="17" text-anchor="middle">核心區去重</text>

  <!-- export -->
  <rect x="1380" y="110" width="190" height="120" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1475" y="148" font-size="20" font-weight="700" text-anchor="middle">整片拼接匯出</text>
  <text x="1475" y="176" font-size="17" text-anchor="middle">TIFF／CSV</text>
  <text x="1475" y="204" font-size="17" text-anchor="middle">→ QuPath</text>

  <!-- main flow arrows -->
  <g stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="220" y1="170" x2="253" y2="170"/>
    <line x1="445" y1="170" x2="478" y2="170"/>
    <line x1="670" y1="170" x2="703" y2="170"/>
    <line x1="895" y1="170" x2="928" y2="170"/>
    <line x1="1120" y1="170" x2="1153" y2="170"/>
    <line x1="1345" y1="170" x2="1378" y2="170"/>
  </g>

  <!-- per-tile loop bracket under M1–M3 -->
  <path d="M480,240 L480,250 L1120,250 L1120,240" fill="none" stroke="#111" stroke-width="2.5"/>
  <text x="800" y="281" font-size="18" text-anchor="middle" fill="#111">逐 tile 處理迴圈</text>

  <!-- callout connectors -->
  <g stroke="#444" stroke-width="2" stroke-dasharray="6,5" fill="none">
    <line x1="170" y1="340" x2="350" y2="232"/>
    <line x1="485" y1="340" x2="650" y2="252"/>
    <line x1="800" y1="340" x2="950" y2="252"/>
    <line x1="1115" y1="340" x2="1060" y2="232"/>
    <line x1="1430" y1="340" x2="1475" y2="232"/>
  </g>

  <!-- callouts -->
  <g font-size="18" text-anchor="middle">
    <rect x="30" y="340" width="280" height="112" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="170" y="373" font-weight="700">① tile 非同步預取</text>
    <text x="170" y="402">讀取與運算重疊</text>

    <rect x="345" y="340" width="280" height="112" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="485" y="373" font-weight="700">② 跨 tile 動態多行程池</text>
    <text x="485" y="402">workers = 4</text>
    <text x="485" y="430">全切片快 2.21×</text>

    <rect x="660" y="340" width="280" height="112" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="800" y="373" font-weight="700">③ 週期性凍結 GC</text>
    <text x="800" y="402">大量物件下的回收成本</text>
    <text x="800" y="430">2,218 s → 59 s</text>

    <rect x="975" y="340" width="280" height="112" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="1115" y="373" font-weight="700">④ 點位偵測改單執行緒</text>
    <text x="1115" y="402">20 執行緒因 GIL 慢 2.77×</text>
    <text x="1115" y="430">改回後整體快 1.6×</text>

    <rect x="1290" y="340" width="280" height="112" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="1430" y="373" font-weight="700">⑤ 拼接階段重寫</text>
    <text x="1430" y="402">非同步分段預取＋管線化</text>
    <text x="1430" y="430">記憶體峰值 45.6 → 17 GB</text>
  </g>

  <!-- legend -->
  <g font-size="17">
    <rect x="30" y="495" width="44" height="28" fill="url(#hatch)" stroke="#555" stroke-width="2"/>
    <text x="84" y="515">組員負責（配準與分割模型）</text>
    <rect x="420" y="495" width="44" height="28" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="474" y="515">本人負責的系統層</text>
    <line x1="720" y1="509" x2="764" y2="509" stroke="#444" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="774" y="515">優化點與作用位置</text>
  </g>
</svg>
